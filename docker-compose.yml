version: '3.9'
services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env.example
    ports:
      - "4000:4000"
    command: sh -c "npx prisma migrate deploy && node dist/index.js"
    volumes:
      - backend-data:/app/data
  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
volumes:
  backend-data:
