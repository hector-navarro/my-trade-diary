<div class="auth-page">
  <div class="card" style="max-width: 420px; margin: 4rem auto;">
    <h2>Create your account</h2>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>Name</label>
      <input formControlName="name" placeholder="Optional" />
      <label>Email</label>
      <input type="email" formControlName="email" placeholder="you@example.com" />
      <label>Password</label>
      <input type="password" formControlName="password" placeholder="Minimum 8 characters" />
      <button type="submit" style="width: 100%; margin-top: 1rem;">Create account</button>
    </form>
    <p style="margin-top: 1rem;">Already registered? <a routerLink="/login">Login</a></p>
    <div *ngIf="error" class="alert danger">{{ error }}</div>
  </div>
</div>
