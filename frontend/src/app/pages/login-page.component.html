<div class="auth-page">
  <div class="card" style="max-width: 420px; margin: 4rem auto;">
    <h2>Welcome back</h2>
    <p>Sign in to review and plan your trades.</p>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>Email</label>
      <input type="email" formControlName="email" placeholder="you@example.com" />
      <label>Password</label>
      <input type="password" formControlName="password" placeholder="••••••••" />
      <button type="submit" style="width: 100%; margin-top: 1rem;">Login</button>
    </form>
    <p style="margin-top: 1rem;">Need an account? <a routerLink="/signup">Create one</a></p>
    <div *ngIf="error" class="alert danger">{{ error }}</div>
  </div>
</div>
